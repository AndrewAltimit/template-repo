[workspace]
resolver = "2"
members = [
    "strands-core",
    "strands-agent",
    "strands-models",
    "strands-tools",
    "strands-session",
    "strands-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# aws-smithy-* 1.x and aws-sdk-* now require Rust 1.94.1
rust-version = "1.94.1"
authors = ["AgentCore Runtime"]
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.54", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# AWS SDK. The SDK crates disable their default `rustls` feature, which only
# enables the legacy hyper 0.14 / rustls 0.21 client (RUSTSEC-2026-0258,
# RUSTSEC-2026-0346/0349, RUSTSEC-2026-0098/0099/0104/0382); the default
# HTTPS client (hyper 1, rustls 0.23 with aws-lc) is kept.
aws-config = { version = "1.13", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = { version = "1.152", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-bedrockagentcore = { version = "1.81", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.124", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = "1.9"
aws-smithy-runtime-api = "1.19"
aws-credential-types = "1.3"

# HTTP server
axum = { version = "0.8", features = ["json", "tokio"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
http-body-util = "0.1"

# Tracing / Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.34"

# MCP support
rmcp = { version = "3.8", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.29", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.12"
base64 = "0.23"
url = "2.5"
regex = "1.13"

# JSON Schema validation
jsonschema = "0.60"

# Crypto
sha2 = "0.11"

# HTTP client (for integration tests)
reqwest = { version = "0.13", features = ["json"] }

# Testing
mockall = "0.15"

[workspace.lints.clippy]
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
