[package]
name = "wrapper-common"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "Shared library for CLI wrapper hardening (binary finder, audit logging, integrity, exec)"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
readme = "README.md"
keywords = ["cli", "security", "wrapper", "hardening"]
categories = ["command-line-utilities", "development-tools"]

[features]
# Build-script helpers (source hashing). Enabled only by the wrappers'
# `[build-dependencies]`, so sha2 never ends up in the wrapper binaries.
build = ["dep:sha2"]

[dependencies]
thiserror = "2"
sha2 = { version = "0.10", optional = true }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
