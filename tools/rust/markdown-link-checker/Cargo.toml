[package]
name = "markdown-link-checker"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
description = "Fast concurrent markdown link validator for CI/CD pipelines"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
readme = "README.md"
keywords = ["markdown", "link-checker", "validation", "ci-cd"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "markdown_link_checker"
path = "src/lib.rs"

[[bin]]
name = "md-link-checker"
path = "src/main.rs"

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Markdown parsing (library only, no CLI/HTML renderer)
pulldown-cmark = { version = "0.13", default-features = false }

# Regex for ignore patterns and HTML attribute scanning
regex = "1.11"

# Serialization (JSON output)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# File discovery honoring .gitignore / .mdlinkignore
ignore = "0.4"

# Percent-decoding of link destinations and fragments
percent-encoding = "2.3"

[dev-dependencies]
tempfile = "3.10"
wiremock = "0.6"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
