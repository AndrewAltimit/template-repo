[package]
name = "git-guard"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "Git CLI wrapper that blocks dangerous operations (force push, skipped hooks, pushes to protected branches)"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
readme = "README.md"
keywords = ["git", "cli", "security", "wrapper"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git"
path = "src/main.rs"

[dependencies]
wrapper-common = { path = "../wrapper-common" }

[build-dependencies]
wrapper-common = { path = "../wrapper-common", features = ["build"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
