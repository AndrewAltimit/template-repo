[package]
name = "gh-validator"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "GitHub CLI wrapper that validates and sanitizes content posted by AI agents"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
readme = "README.md"
keywords = ["github", "cli", "security", "validation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "gh"
path = "src/main.rs"

[dependencies]
wrapper-common = { path = "../wrapper-common" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
regex = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
thiserror = "2"
url = "2.5"

[build-dependencies]
wrapper-common = { path = "../wrapper-common", features = ["build"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
opt-level = 3
