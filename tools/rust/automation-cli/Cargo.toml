[package]
name = "automation-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "Unified CLI for CI/CD orchestration, service launching, and automation"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
readme = "README.md"
keywords = ["ci", "automation", "cli", "docker"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "automation-cli"
path = "src/main.rs"

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# HTTP client for health checks (blocking API; wait/launch/service/proxy)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Serialization (PR comment JSON, Claude stream-json, .agents.yaml)
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"

# Terminal colors
owo-colors = "4.0"

# Self-deleting temp files for prompts / commit messages / comment bodies
tempfile = "3.10"

# Secret masking shared with gh-validator wrapper. Used to redact stream-json
# logs and unpushed-commit patches before they are uploaded as workflow
# artifacts. Loads `.secrets.yaml` from the repo root.
gh-validator = { path = "../gh-validator" }

[target.'cfg(unix)'.dependencies]
# getuid/getgid for docker compose USER_ID/GROUP_ID
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
