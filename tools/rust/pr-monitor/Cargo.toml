[package]
name = "pr-monitor"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "GitHub PR comment and review monitoring with intelligent classification"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
readme = "README.md"
keywords = ["github", "pr", "monitoring", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "pr-monitor"
path = "src/main.rs"

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Regex for pattern matching
regex = "1.11"

# Error handling
thiserror = "2.0"

# Time handling
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# Signal handling
ctrlc = "3.4"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
opt-level = 3
