[package]
name = "code-review-processor"
version = "0.2.0"
edition = "2024"
description = "Process code review JSON output from AgentCore"
rust-version = "1.91"
license = "MIT"

[lib]
name = "code_review_processor"
path = "src/lib.rs"

[[bin]]
name = "code-review-processor"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging (to stderr)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
