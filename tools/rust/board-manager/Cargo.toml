[package]
name = "board-manager"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "GitHub Projects v2 board manager for AI agent work coordination"
authors = ["Andrew Altimit"]
license = "MIT"
readme = "README.md"

[[bin]]
name = "board-manager"
path = "src/main.rs"

[dependencies]
# Async runtime (only what the CLI actually uses)
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "time"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
thiserror = "2.0"

# Logging (always written to stderr so stdout stays machine-readable)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Session ID generation
uuid = { version = "1.0", features = ["v4"] }

# Pattern matching (approval triggers, judgement heuristics, noise filters)
regex = "1.10"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
