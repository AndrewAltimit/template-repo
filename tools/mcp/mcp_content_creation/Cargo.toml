[package]
name = "mcp-content-creation"
version = "2.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]
description = "MCP server for content creation - sandboxed LaTeX/TikZ compilation, PDF previews, and Manim animations"

[[bin]]
name = "mcp-content-creation"
path = "src/main.rs"

[dependencies]
# MCP Core (path to sibling directory)
mcp-core = { path = "../mcp_core_rust/crates/mcp-core" }

# Async runtime
tokio = { version = "1.44", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"

# Error handling
anyhow = "1.0"

# Temp directories for sandboxed compilation
tempfile = "3.10"

# Regex for parsing
regex = "1.10"

[target.'cfg(unix)'.dependencies]
# kill(2) for process-group cleanup on timeout
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
# No `panic = "abort"`: mcp-core wraps tool calls in catch_unwind, which only
# works when panics unwind.
strip = true
