[package]
name = "mcp-sprite-sheet"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]
description = "MCP server for programmatic pixel art and sprite sheet creation"

[[bin]]
name = "mcp-sprite-sheet"
path = "src/main.rs"

[dependencies]
# MCP Core (path to sibling directory)
mcp-core = { path = "../mcp_core_rust/crates/mcp-core" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Field paths ("pixels[3].x") in argument-parsing error messages
serde_path_to_error = "0.1"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"

# Image processing (PNG/JPEG/WebP/GIF decode; PNG + animated GIF encode)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

# Base64 encoding
base64 = "0.22"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"
mcp-testing = { path = "../mcp_core_rust/crates/mcp-testing" }

[profile.release]
lto = true
codegen-units = 1
strip = true
# NOTE: do not set `panic = "abort"`. mcp-core wraps every tool call in a
# `catch_unwind` boundary so a panicking tool becomes an `isError` result;
# aborting on panic would defeat that and take the whole server down.
