[package]
name = "mcp-blender"
version = "2.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]
description = "MCP server for headless Blender 3D content creation and rendering"

[[bin]]
name = "mcp-blender"
path = "src/main.rs"

[dependencies]
# MCP Core (path to sibling directory)
mcp-core = { path = "../mcp_core_rust/crates/mcp-core" }

# Async runtime
tokio = { version = "1.54", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.29", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
which = "8.0"
dirs = "7.0"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = true
codegen-units = 1
strip = true
