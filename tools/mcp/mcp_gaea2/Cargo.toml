[package]
name = "mcp-gaea2"
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]
description = "MCP server for Gaea2 terrain generation"

[[bin]]
name = "mcp-gaea2"
path = "src/main.rs"

[dependencies]
# MCP Core (path to sibling directory)
mcp-core = { path = "../mcp_core_rust/crates/mcp-core" }

# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
async-trait = "0.1"

# Serialization. `preserve_order` keeps object keys in insertion order so the
# generated .terrain files put `$id`/`$type` first and keep a stable,
# Gaea-like property order (Json.NET expects metadata properties first).
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"

# Error handling
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Base64 encoding (download tool)
base64 = "0.22"

# UUID generation (project / terrain ids, unique file names)
uuid = { version = "1.8", features = ["v4"] }

# Random seeds for generator nodes
rand = "0.8"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
# NOTE: no `panic = "abort"` -- mcp-core catches tool panics with
# `catch_unwind`, which only works with the default unwind strategy.
strip = true
