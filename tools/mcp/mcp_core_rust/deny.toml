# cargo-deny configuration for mcp_core_rust
# https://embarkstudios.github.io/cargo-deny/

[advisories]
unmaintained = "workspace"
# No ignores: every advisory against the lockfile is fixed by an upgrade. Add
# an entry only with a comment naming the advisory and why no patched release
# can be used yet.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BSL-1.0",
    # webpki-root-certs (Mozilla CA bundle, pulled in by reqwest 0.13 through
    # rustls-platform-verifier) is published under this permissive data license.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Skip certain crates that may have multiple versions
skip = [
    # Common crates that often have multiple versions
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
