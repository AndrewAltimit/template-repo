[workspace]
resolver = "2"
members = [
    "crates/mcp-core",
    "crates/mcp-macros",
    "crates/mcp-client",
    "crates/mcp-testing",
    "crates/mcp-ai-consult",
    "crates/paste-shim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.54", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# HTTP framework
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Schema generation
schemars = "1.2"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# HTTP client (for client mode)
reqwest = { version = "0.13", features = ["json"] }

# UUID
uuid = { version = "1.29", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Proc macro support
syn = { version = "3.0", features = ["full", "parsing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

# Testing
axum-test = "21.1"

# Internal crates
mcp-core = { path = "crates/mcp-core" }
mcp-macros = { path = "crates/mcp-macros" }
mcp-client = { path = "crates/mcp-client" }
mcp-testing = { path = "crates/mcp-testing" }
mcp-ai-consult = { path = "crates/mcp-ai-consult" }

[workspace.lints.clippy]
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
lto = true
codegen-units = 1
# No `panic = "abort"`: mcp-core wraps tool calls in catch_unwind, which only
# works when panics unwind.
strip = true

[profile.dev]
opt-level = 0
debug = true
