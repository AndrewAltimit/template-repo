[package]
name = "mcp-desktop-control"
version = "1.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]
description = "MCP server for cross-platform desktop control and automation (X11 and Windows)"

[[bin]]
name = "mcp-desktop-control"
path = "src/main.rs"

[dependencies]
# MCP Core (path to sibling directory)
mcp-core = { path = "../mcp_core_rust/crates/mcp-core" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Time (screenshot file names)
chrono = "0.4"

# Default output directory resolution
dirs = "5.0"

# Image handling (PNG encoding, downscaling) and inline image transport
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# X11 support (Linux). Pure-Rust protocol implementation: no libX11/libxcb at
# build or run time. Only the RandR (monitors) and XTEST (input) extensions
# are used.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr", "xtest"] }

# Windows support (Win32 API)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
# No `panic = "abort"`: mcp-core converts tool panics into error results via
# catch_unwind, and blocking desktop operations rely on JoinError on panic.
# Aborting would turn any bug into a full server crash.
strip = true
