[package]
name = "mcp-video-editor"
version = "2.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]
description = "MCP server for automated video editing: analysis, EDL generation, ffmpeg rendering, clips and captions"

[[bin]]
name = "mcp-video-editor"
path = "src/main.rs"

[dependencies]
# MCP Core (path to sibling directory)
mcp-core = { path = "../mcp_core_rust/crates/mcp-core" }

# Async runtime
tokio = { version = "1.40", features = ["full", "process"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Directories and paths
dirs = "6.0"
tempfile = "3.10"

# UUID for job IDs
uuid = { version = "1.10", features = ["v4"] }

# Which for finding executables
which = "7.0"

# No `panic = "abort"`: mcp-core converts a panicking tool call into an error
# result via catch_unwind, and the job supervisor records panicking jobs as
# failed. Both require unwinding.
[profile.release]
lto = true
codegen-units = 1
strip = true
