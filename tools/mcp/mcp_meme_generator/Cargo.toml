[package]
name = "mcp-meme-generator"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]
description = "MCP server for meme generation with text overlays"

[[bin]]
name = "mcp-meme-generator"
path = "src/main.rs"

[dependencies]
# MCP Core (path to sibling directory)
mcp-core = { path = "../mcp_core_rust/crates/mcp-core" }

# Async runtime
tokio = { version = "1.54", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client (for uploads)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart"] }

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Image processing. Only the codecs templates may use (see
# templates::IMAGE_EXTENSIONS); the default set adds AVIF via rav1e, which
# pulls in the unmaintained `paste` (RUSTSEC-2024-0436).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Caption fonts: skrifa parses fonts, ab_glyph_rasterizer turns outlines into
# coverage. (Replaces ab_glyph, whose ttf-parser is unmaintained,
# RUSTSEC-2026-0192.)
skrifa = "0.49"
ab_glyph_rasterizer = "0.1"

# Base64 encoding
base64 = "0.23"

# Time (output file names)
chrono = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
# No `panic = "abort"`: mcp-core wraps tool calls in catch_unwind, which only
# works when panics unwind.
strip = true
