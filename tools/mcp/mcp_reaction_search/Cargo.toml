[package]
name = "mcp-reaction-search"
version = "1.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]
description = "MCP server for semantic reaction image search"

[[bin]]
name = "mcp-reaction-search"
path = "src/main.rs"

[dependencies]
# MCP Core (path to sibling directory)
mcp-core = { path = "../mcp_core_rust/crates/mcp-core" }

# Async runtime
tokio = { version = "1.54", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Maintained continuation of serde_yaml (unsafe-libyaml is unmaintained).
yaml_serde = "0.10"

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Directories
dirs = "7.0"

# Sentence embeddings (ONNX-based)
fastembed = "7"

# Linear algebra
ndarray = "0.17"

[profile.release]
lto = true
codegen-units = 1
# Note: no `panic = "abort"`: mcp-core runs each tool call inside a
# catch_unwind boundary, which only works with the default unwinding panics.
strip = true
