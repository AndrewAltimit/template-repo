[package]
name = "mcp-virtual-character"
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]
description = "MCP server for virtual character control via VRChat OSC"

[lib]
name = "mcp_virtual_character"
path = "src/lib.rs"

[[bin]]
name = "mcp-virtual-character"
path = "src/main.rs"

[dependencies]
# MCP Core (path to sibling directory)
mcp-core = { path = "../mcp_core_rust/crates/mcp-core" }

# Async runtime
tokio = { version = "1.54", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client (audio URL downloads)
reqwest = { version = "0.13", features = ["json"] }

# OSC protocol
rosc = "0.11"

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Base64 encoding
base64 = "0.23"

# Unique temp file names for audio playback
uuid = { version = "1.29", features = ["v4"] }

# Regex for audio tag parsing
regex = "1.13"

# NOTE: no `panic = "abort"`: mcp-core wraps tool execution in a
# catch_unwind boundary, which only works with the default unwind strategy.
[profile.release]
lto = true
codegen-units = 1
strip = true
