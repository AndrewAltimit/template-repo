[package]
name = "mcp-agentcore-memory"
version = "1.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]
description = "MCP server for AI agent memory backed by the ChromaDB vector database"

[[bin]]
name = "mcp-agentcore-memory"
path = "src/main.rs"

[features]
default = ["fastembed"]
# Local ONNX sentence embeddings (all-MiniLM-L6-v2, the same model ChromaDB's
# Python client uses by default). Without this feature only the lexical
# `hash` embedder is available.
fastembed = ["dep:fastembed"]

[dependencies]
# MCP Core (path to sibling directory)
mcp-core = { path = "../mcp_core_rust/crates/mcp-core" }

# Async runtime
tokio = { version = "1.54", features = ["full"] }
async-trait = "0.1"

# HTTP client for ChromaDB
reqwest = { version = "0.13", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.29", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.13"
sha2 = "0.11"

# Sentence embeddings (ONNX-based), optional. Text models only: the default
# `image-models` feature pulls in image with every codec (rav1e -> paste,
# RUSTSEC-2024-0436) and text embedding never uses it.
fastembed = { version = "7", optional = true, default-features = false, features = [
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
] }

# tokenizers (via fastembed) needs `paste`, which is unmaintained
# (RUSTSEC-2024-0436). Swap in the pastey-backed shim; see its lib.rs.
[patch.crates-io]
paste = { path = "../mcp_core_rust/crates/paste-shim" }

[profile.release]
lto = true
codegen-units = 1
# Keep unwinding (not `abort`) so mcp-core's catch_unwind panic boundary around
# tool execution can turn an unexpected panic into a tool error instead of
# killing the whole server process.
strip = true
