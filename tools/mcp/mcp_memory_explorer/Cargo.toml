[package]
name = "mcp-memory-explorer"
version = "1.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]
description = "Read-only MCP server for process memory exploration and reverse engineering (Windows and Linux)"

[[bin]]
name = "mcp-memory-explorer"
path = "src/main.rs"

[dependencies]
# MCP Core (path to sibling directory)
mcp-core = { path = "../mcp_core_rust/crates/mcp-core" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Cross-platform process listing
sysinfo = "0.33"

# Fast byte search for signature/value scans
memchr = "2.7"

# Windows process memory API (read-only subset)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
# Keep unwinding (no `panic = "abort"`): mcp-core wraps every tool call in a
# catch_unwind boundary, which only works when panics unwind.
strip = true
