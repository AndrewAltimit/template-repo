[package]
name = "mcp-ai-toolkit"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]
description = "MCP server for AI Toolkit - LoRA training management"

[[bin]]
name = "mcp-ai-toolkit"
path = "src/main.rs"

[dependencies]
# MCP Core (path to sibling directory)
mcp-core = { path = "../mcp_core_rust/crates/mcp-core" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
uuid = { version = "1.10", features = ["v4"] }
base64 = "0.22"
regex = "1.10"
sha2 = "0.10"

# System info
sysinfo = "0.31"

[target.'cfg(unix)'.dependencies]
# Process-group signalling for graceful training shutdown (SIGTERM -> SIGKILL)
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
# NOTE: no `panic = "abort"`: mcp-core wraps tool execution in catch_unwind,
# which only works with the default unwinding strategy.
strip = true
