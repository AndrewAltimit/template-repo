[package]
name = "mcp-github-board"
version = "2.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]
description = "MCP server for GitHub Projects v2 board operations (wraps the board-manager CLI)"

[[bin]]
name = "mcp-github-board"
path = "src/main.rs"

[dependencies]
# MCP Core (path to sibling directory)
mcp-core = { path = "../mcp_core_rust/crates/mcp-core" }

# Async runtime
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
which = "7.0"
dirs = "6.0"

[profile.release]
lto = true
codegen-units = 1
# No `panic = "abort"`: mcp-core wraps tool calls in catch_unwind, which only
# works when panics unwind.
strip = true
