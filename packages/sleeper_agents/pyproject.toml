[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper-agents"
version = "2.0.0"
description = "Framework for creating and studying sleeper agents"
readme = "README.md"
authors = [
    {name = "Andrew Altimit"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13"
dependencies = [
    # Core ML Libraries (minimal runtime)
    # torch 2.14.x is the line torchvision 0.29.x is built against (the GPU image
    # removes torchvision, but other environments may install both). The PyPI
    # wheels bundle the CUDA 13.0 runtime (needs NVIDIA driver >= 580).
    "torch>=2.14.1",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "transformer-lens>=4.3.0",
    # transformer-lens>=4.0 already requires transformers>=5.9, and the training
    # code uses TrainingArguments(eval_strategy=...); keep a single consistent floor.
    "transformers>=5.21.0",
    # Model Management (transformers 5.21 requires huggingface-hub>=1.31,<3)
    "huggingface-hub>=2.3.0",
    "psutil>=7.2.2",
    # API Server
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
    # Visualization
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "seaborn>=0.13.2",
    "pandas>=3.1.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    # Notebook Support
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
    # Type Checking
    "types-requests>=2.33.0",
    # Code Quality
    "black>=26.10.1",
    "isort>=9.0.2",
    "flake8>=7.5.0",
    # Documentation
    "sphinx>=9.2.0",
    "sphinx-rtd-theme>=3.1.0",
    # External Audit Tools (for gradient-based attack validation only)
    "adversarial-robustness-toolbox>=1.20.1",  # Not for production, only for gradient attack validation
]
evaluation = [
    # Additional dependencies for full evaluation system
    "scikit-learn>=1.9.1",
    # Report Generation
    "jinja2>=3.1.6",
    # Configuration
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.4",
    # CLI
    "tqdm>=4.70.1",
    # Utilities
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "python-multipart>=0.0.32",
]
training = [
    # Dataset loading/building (imported by sleeper_agents.training.*)
    "datasets>=5.1.0",
    # Parameter-efficient fine-tuning (LoRA/QLoRA)
    "peft>=0.21.2",
    # Distributed / mixed-precision training utilities
    "accelerate>=1.15.0",
    # No trl: RL (PPO) safety training is not implemented (SafetyTrainer.apply_rl_ppo
    # raises NotImplementedError), so nothing imports it.
    # 4-bit/8-bit quantization for QLoRA
    "bitsandbytes>=0.50.2",
]
# The 'all' group combines runtime, dev, evaluation, and training for a complete environment.
# It references the other extras (self-referencing extras) so the lists cannot drift apart.
all = [
    "sleeper-agents[dev]",
    "sleeper-agents[evaluation]",
    "sleeper-agents[training]",
]

[project.urls]
Homepage = "https://github.com/AndrewAltimit/template-repo"
Documentation = "https://github.com/AndrewAltimit/template-repo/tree/main/packages/sleeper_agents/docs"
Issues = "https://github.com/AndrewAltimit/template-repo/issues"

[project.scripts]
sleeper-detect = "sleeper_agents.cli:main"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "sleeper_agents.tests",
    "sleeper_agents.tests.*",
    "sleeper_agents.docs",
    "sleeper_agents.docs.*",
    "sleeper_agents.examples",
    "sleeper_agents.examples.*",
    "sleeper_agents.scripts",
    "sleeper_agents.scripts.*",
    "sleeper_agents.notebooks",
    "sleeper_agents.notebooks.*",
    "sleeper_agents.dashboard",
    "sleeper_agents.dashboard.*",
    "sleeper_agents.gpu_orchestrator",
    "sleeper_agents.gpu_orchestrator.*",
    "sleeper_agents.docker",
    "sleeper_agents.docker.*",
    "sleeper_agents.bin",
    "sleeper_agents.bin.*",
    "sleeper_agents.artifacts",
    "sleeper_agents.artifacts.*",
    # Generated/runtime directories
    "sleeper_agents.wandb",
    "sleeper_agents.wandb.*",
    "sleeper_agents.outputs",
    "sleeper_agents.outputs.*",
    "sleeper_agents.logs",
    "sleeper_agents.logs.*",
    "sleeper_agents.checkpoints",
    "sleeper_agents.checkpoints.*",
    "sleeper_agents.runs",
    "sleeper_agents.runs.*",
    "sleeper_agents.mlruns",
    "sleeper_agents.mlruns.*",
    "sleeper_agents.build",
    "sleeper_agents.build.*",
    "sleeper_agents.dist",
    "sleeper_agents.dist.*",
]

[tool.setuptools.package-data]
"sleeper_agents" = [
    "test_suites/*.yaml",
    "configs/*.json",
    "docs/*.md",
    "evaluation/templates/*.html",  # HTML report templates
]

[tool.black]
line-length = 127
target-version = ['py313']

[tool.flake8]
max-line-length = 127
exclude = [".git", "__pycache__", "build", "dist"]
ignore = ["E203", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Test isolation and reliability
addopts = [
    "-v",  # Verbose output
    "--strict-markers",  # Ensure all markers are registered
    "--tb=short",  # Shorter tracebacks
    "-ra",  # Show summary of all test outcomes
]
# Register custom markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
