# cargo-deny configuration for sleeper_agents
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
unmaintained = "workspace"
# RUSTSEC-2026-0007 (bytes) and RUSTSEC-2026-0009 (time) were fixed by
# upgrading; no advisories are ignored.
ignore = []

[licenses]
# Allow common permissive licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    # webpki-root-certs (Mozilla CA bundle as data), pulled in by reqwest 0.13
    # through rustls-platform-verifier
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
