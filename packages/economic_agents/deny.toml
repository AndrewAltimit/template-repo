# cargo-deny configuration for economic_agents
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
unmaintained = "workspace"
# RUSTSEC-2026-0007 (bytes) and RUSTSEC-2026-0009 (time) were fixed by
# upgrading; no advisories are ignored. YAML parsing uses serde_norway, whose
# unsafe-libyaml-norway fork is not covered by RUSTSEC-2024-0449.
ignore = []

[licenses]
# Allow common permissive licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    # webpki-root-certs (Mozilla CA bundle as data), pulled in by reqwest 0.13
    # through rustls-platform-verifier
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate from a registry is specified
wildcards = "allow"
# Allow specific crates (none banned for now)
deny = []

[sources]
# Lint level for what to happen when a crate from a registry is used
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git source is used
unknown-git = "warn"
# Allow crates from these registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
