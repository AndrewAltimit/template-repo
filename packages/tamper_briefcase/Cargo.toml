[workspace]
resolver = "2"
members = [
    "crates/tamper-common",
    "crates/tamper-sensor",
    "crates/tamper-gate",
    "crates/tamper-challenge",
    "crates/tamper-recovery",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/template-repo"
authors = ["AndrewAltimit"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hardware (Raspberry Pi)
rppal = "0.22"

# Cryptography
scrypt = { version = "0.12", features = ["alloc", "getrandom", "phc"] }
subtle = "2.6"
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
hkdf = "0.13"
sha2 = "0.11"
aes-gcm = "0.11"
rand = "0.10"
zeroize = { version = "1.9", features = ["derive"] }
# RustCrypto FIPS 203 / FIPS 204 implementations. These replaced the
# PQClean-based pqcrypto-* crates (unmaintained, RUSTSEC-2026-0161..0166);
# key, ciphertext, and signature encodings are byte-identical.
ml-kem = { version = "0.3", features = ["zeroize"] }
ml-dsa = { version = "0.1", features = ["zeroize"] }

# CLI
clap = { version = "4.6", features = ["derive"] }
rpassword = "7.5"

# Unix
nix = { version = "0.31", features = ["fs", "signal", "process", "user", "poll", "reboot"] }
secrecy = { version = "0.10", features = ["serde"] }

# Base64
base64 = "0.23"

# Hex encoding
hex = "0.4"

# Internal crates
tamper-common = { path = "crates/tamper-common" }

# Dev/test
tempfile = "3.27"

[workspace.lints.clippy]
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
